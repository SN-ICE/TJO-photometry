# Telescopi Joan Oro (OAdM) + MEIA2 CCD
name: TJO/MEIA2
telescope: TJO
site: OAdM

header:
  mjd: [MJD-OBS]
  jd: [JD]
  dateobs: [DATE-OBS]
  timeobs: [TIME-OBS]
  exptime: [EXPTIME]
  filter: [FILTER]
  object: [OBJECT, TARGET]
  gain: [GAIN]                 # e- per ADU
  readnoise: [RDNOISE]         # e-
  target_ra: [OBJRA, RA]       # sexagesimal hours
  target_dec: [OBJDEC, DEC]    # sexagesimal degrees
  # TJO writes RA in hours (OBJRA/RA), so a bare numeric RA is an hour angle.
  coord_unit: hourangle
  binning_x: [XFACTOR]
  binning_y: [YFACTOR]
  airmass: [AIRMASS]
  imagetype: [IMAGETYP, OBSTYPE]
  quality: [IMGQS]

defaults:
  gain: 1.04                   # header value; superseded by noise_model below
  readnoise: 9.0
  # Measured on the delivered frames: pixel variance against sky level over 42
  # frames, six filters, dark sky to full moon (135-6886 ADU). One straight
  # line fits them all to a few per cent, and fitted per filter alone the slope
  # gives the same gain in B, V, g and r (1.94-1.96). The header's GAIN=1.04
  # and RDNOISE=9 predict three times the variance seen on a dark night.
  # The offset is negative, so the "sky" carries a non-photon pedestal of
  # 41 ADU (no read noise) to 83 ADU (9 e-); the sky alone cannot separate them.
  noise_model:
    gain: 1.95                 # e- per ADU, +-0.03
    offset_adu2: -21.0         # sigma^2 = S/gain + offset, +-2
  pixel_scale: 0.36            # arcsec/px, unbinned; only used if WCS is absent
  saturation_adu: 55000
  # Measured on SN2026aaiv: point-source cores go flat between 50000 and 54000
  # ADU while genuinely clipped stars sit near 64000, so the useful range ends
  # well below `saturation_adu`.
  nonlinear_adu: 48000

# FILTER header value -> canonical band name
filters:
  "B": B
  "V": V
  "R": R
  "I": I
  "U": U
  "SDSS u": u
  "SDSS g": g
  "SDSS r": r
  "SDSS i": i
  "SDSS z": z
  "u": u
  "g": g
  "r": r
  "i": i
  "z": z
  "Clear": C
  "None": C

# Photometric system each band is reported in
systems:
  U: vega
  B: vega
  V: vega
  R: vega
  I: vega
  u: ab
  g: ab
  r: ab
  i: ab
  z: ab
